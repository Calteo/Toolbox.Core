name: Toolbox.Core

on:
  push:
    branches: [ "main" ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BUILD_VERSION: "0.6.${{ github.run_number }}"
  PROJECT_NAME: "Toolbox.Core"

jobs:

  build:
    name: Build
    runs-on: windows-latest  

    steps:
    
    # setup
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # - name: Install NuGet
    #  uses: NuGet/setup-nuget@v1.0.5

    # Install docFX
    - name: Install DocFX
      run: dotnet tool install -g docfx

    # - name: Echo Version 
    #  run: echo "Version = ${{ env.BUILD_VERSION }}"
    
    - name: Version Visual Studio SDK projects
      uses: roryprimrose/set-vs-sdk-project-version@v1.0.3
      with:
        version: "${{ env.BUILD_VERSION }}.0"
        assemblyVersion: "${{ env.BUILD_VERSION }}.0"
        fileVersion: "${{ env.BUILD_VERSION }}.0"
        informationalVersion: "${{ env.BUILD_VERSION }}.0"
    
    # Compile the solution
    - name: Compile solution
      run: dotnet build src\${{ env.PROJECT_NAME }}.slnx -c Release -o output

    # Test?
    
    # Documentation
    - name: Build Documentation
      working-directory: docfx_project
      run: docfx docfx.json
      continue-on-error: false

    - name: Remove unnecessary files
      run: del output\*.pdb,output\*.dev.json,output\*.deps.json 

    - name: Zip binaries
      uses: TheDoctor0/zip-release@0.6.2
      with:
        filename: '${{ env.PROJECT_NAME }}.${{ env.BUILD_VERSION }}-binary.zip'
        directory: output
        path: ${{ env.PROJECT_NAME }}.dll
        type: 'zip'

    # create github release
    - name: Create Release
      uses: softprops/action-gh-release@v1        
      with:
        name: Release ${{ env.BUILD_VERSION }}
        tag_name: ${{ env.BUILD_VERSION }}
        files: |
          ./output/${{ env.PROJECT_NAME }}.${{ env.BUILD_VERSION }}-binary.zip
          ./output/${{ env.PROJECT_NAME }}.${{ env.BUILD_VERSION }}.nupkg      

    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: NuGet push
      run: dotnet nuget push **\*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json    

    # publish documentation
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docfx_project/docs